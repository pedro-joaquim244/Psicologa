<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#F3F1EA" />

    <script>
      (() => {
        try {
          const stored = localStorage.getItem('psicologa_tema');
          const theme = stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b0b0c' : '#f3f1ea';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>

    <meta
      name="description"
      content="Psicologia, escuta e acolhimento com Mauricéia Soares, em atendimentos online e presenciais."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://psicologa-olive.vercel.app/" />
